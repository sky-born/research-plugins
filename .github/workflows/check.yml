# Runs the same pre-release checks as `python scripts/release.py check` on the three
# operating systems the plugins are used on. The Claude Code CLI is not installed on
# the runners, so `claude plugin validate` is the one check left to the releasing computer.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the tool hash list and one test read the whole history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Pre-release checks
        run: python -X utf8 scripts/release.py check --skip-claude
